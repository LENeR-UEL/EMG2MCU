[tool.poetry]
name = "emg2mcu"
version = "0.1.0"
description = "EMG processing, AutoML classification, and microcontroller model export"
authors = [
    # TODO: replace with the project maintainer(s), e.g.
    # "First Last <first.last@example.com>",
]
license = "MIT"
readme = "README.md"
homepage = "https://github.com/LENeR-UEL/EMG2MCU"
repository = "https://github.com/LENeR-UEL/EMG2MCU"
keywords = [
    "emg",
    "electromyography",
    "automl",
    "embedded",
    "microcontroller",
    "feature-extraction",
    "signal-processing",
]
packages = [
    { include = "EMG2MCU" },
]

[tool.poetry.dependencies]
python = ">=3.10"

catboost = ">=1.2"
ipython = ">=8.0"
joblib = ">=1.3"
lightgbm = ">=4.0"
matplotlib = ">=3.7"
numpy = ">=1.24"
pandas = ">=2.0"
scikit-learn = ">=1.3"
scipy = ">=1.10"
tsfresh = ">=0.20"
xgboost = ">=2.0"

# -- optional docs dependencies (pip install ".[docs]") --
sphinx = {version = ">=7.3", optional = true}
pydata-sphinx-theme = {version = ">=0.15", optional = true}
sphinx-autoapi = {version = ">=3.1", optional = true}
myst-parser = {version = ">=3.0", optional = true}
sphinx-copybutton = {version = ">=0.5", optional = true}
sphinx-design = {version = ">=0.6", optional = true}

[tool.poetry.extras]
dev = ["pytest"]
docs = [
    "sphinx",
    "pydata-sphinx-theme",
    "sphinx-autoapi",
    "myst-parser",
    "sphinx-copybutton",
    "sphinx-design",
]

[tool.poetry.group.dev.dependencies]
pytest = ">=7.0"

[tool.poetry.group.docs.dependencies]
sphinx = ">=7.3"
pydata-sphinx-theme = ">=0.15"
sphinx-autoapi = ">=3.1"
myst-parser = ">=3.0"
sphinx-copybutton = ">=0.5"
sphinx-design = ">=0.6"

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"
